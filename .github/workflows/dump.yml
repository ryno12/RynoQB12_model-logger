name: Weekly Parquet backup

on:
  schedule:
    - cron: '0 12 * * 2'        # Tuesdays 12:00 UTC (after Monday night games settle)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt pyarrow
      - name: Dump tables to Parquet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m logger.dump_parquet
      - name: Commit backup
        run: |
          git config user.name "rynoqb12-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dumps
          git diff --cached --quiet || git commit -m "Weekly Parquet backup $(date -u +%F)"
          git push
